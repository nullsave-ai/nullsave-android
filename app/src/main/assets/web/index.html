<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1380, initial-scale=0.55, minimum-scale=0.25, maximum-scale=3.0, user-scalable=yes"/>
  <title>NullSave Terminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      color: #e0e0e0;
      width: 100%;
      height: 100%;
      min-width: 1380px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #root {
      width: 100%;
      min-height: 100%;
    }
  </style>
  <script>
    // Electron bridge polyfill for mobile WebView
    window.mkElectron = {
      isElectron: true,
      launchSecret: "nullsave-secret-key",
      openInNewWindow: function(opts) { console.log("[NullSave] openInNewWindow", opts); },
      openExternal: function(url) { window.open(url, '_blank'); },
      saveScreenshot: function() { console.log("[NullSave] saveScreenshot"); },
      exportLog: function() { console.log("[NullSave] exportLog"); },
      fetchTrumpNews: function() { return Promise.resolve([]); },
      getTermsAcceptance: function() { return Promise.resolve({ accepted: true, version: 2, at: Date.now() }); },
      openAgreementView: function() {},
      openReportWindow: function() {},
      openLearnWindow: function(slug) { window.location.href = '/learn-presentations/' + slug + '/index.html'; },
      secureSavePassword: function() { return Promise.resolve(true); },
      secureLoadPassword: function() { return Promise.resolve(""); },
      secureClearPassword: function() { return Promise.resolve(true); },
      downloadAndInstall: function() {}
    };

    window.onerror = function(msg, url, line, col, err) {
      console.warn("[NullSave Error]", msg, "at", url, line, col, err);
      return false;
    };
  </script>
  <script defer="defer" src="/static/js/main.8f9b6f5f.js"></script>
  <link href="/static/css/main.c335e7bf.css" rel="stylesheet"/>
</head>
<body>
  <div id="root"></div>
</body>
</html>
